[package]
name = "dsch"
version = "0.1.0"
edition = "2024"

[dependencies]
pest = "2.8.6"
pest_derive = "2.8.6"
midly = {version = "0.5.3", features = ["alloc", "std"]}
num-rational = { version = "0.4.2", features = ["num-bigint"] }
clap = {version = "4.6.1", features = ["derive"]}
clap_derive = "4.6.1"
colprint = "0.0.0"
colonnade = { version = "1.3.3", features = ["nbsp"]}
crossterm = "0.29.0"
rust-sugiyama = "0.4.0"
derive_more = { version = "2.1.1", features = ["from", "into"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"

# [profile.dev]
# opt-level = 1

# [profile.dev.package."*"]
# opt-level = 3
